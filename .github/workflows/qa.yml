# Automated QA: builds the app, runs it in an Android TV emulator, and checks it end to end.
# - The setup web page answers on port 8642 and saves what a browser sends it.
# - Screenshots of the main screens are attached to the run (Artifacts > qa-results).
# Runs on every push to main and from the Actions tab ("Run workflow").
name: QA

on:
  push:
    branches: [main]
    # Docs and web pages do not change the app, so they do not need a new build.
    paths-ignore: ["docs/**", "**/*.md", "wall/**", "rd-proxy/**", "tools/webtest/**", ".claude/**"]
  workflow_dispatch:

# A newer push replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Same unit tests as the Build APK workflow, so a QA run from the Actions tab on a branch checks them too.
      - name: Run unit tests
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest

      - name: Build APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/qa/run-qa.sh

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: qa-out/
