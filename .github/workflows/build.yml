# Builds the McD TV APK in the cloud on every push to main.
# Output: (1) a downloadable workflow artifact, (2) a GitHub Release with the APK attached.
# The Release always includes Jarvis.apk (and McD-TV.apk for old links), so this link never changes:
#   https://github.com/<you>/<repo>/releases/latest/download/Jarvis.apk
name: Build APK

on:
  push:
    branches: [main]
    # Docs and web pages do not change the app, so they do not need a new build.
    paths-ignore: ["docs/**", "**/*.md", "wall/**", "rd-proxy/**", "tools/webtest/**", ".claude/**"]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab (on a branch other than main: test APK, no Release)

permissions:
  contents: write # needed to create Releases

# A newer push replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # The signing key lives in a GitHub secret, never in the code.
      # Same key every build = the Fire Stick accepts each new APK as an update.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/mcdtv.jks
            echo "Signing key restored."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set. Building with a temporary key; you may need to uninstall before updating."
          fi

      # Fast JVM unit tests (app/src/test). A failing test stops the build before any APK or Release is made.
      # Same env as the APK step so the release classes compiled here are reused by assembleRelease.
      - name: Run unit tests
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --stacktrace

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Build release APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: |
          VERSION="0.2.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "McD-TV-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "McD-TV.apk"
          cp app/build/outputs/apk/release/app-release.apk "Jarvis.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: McD-TV-v${{ env.VERSION }}
          path: McD-TV-v${{ env.VERSION }}.apk

      # Only main publishes a Release (the TVs update from it). "Run workflow" on any other branch
      # makes a test APK: download it from this run's artifacts and sideload it on one TV.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Jarvis v${{ env.VERSION }}
          body: "Built from commit ${{ github.sha }}. Install on Fire TV with the Downloader app."
          make_latest: true
          files: |
            McD-TV-v${{ env.VERSION }}.apk
            McD-TV.apk
            Jarvis.apk
