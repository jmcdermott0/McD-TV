# Checks the web app (docs/app) on every change to it: script syntax, then headless Chromium against a mock
# IPTV server (tools/webtest). Nothing real is called: ESPN is mocked, every other host is blocked.
# Free (GitHub Actions minutes); it never deploys anything, so it costs no Netlify credits.
name: Web QA

on:
  push:
    branches: [main]
    paths: ["docs/**", "tools/webtest/**", "tools/livehome/**", "tools/truecrime/**", ".github/workflows/web-qa.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script syntax (node --check)
        run: |
          for f in docs/app/index.html docs/index.html docs/app/resume.html; do
            python3 -c "import re,sys; s=open(sys.argv[1]).read(); open('/tmp/x.js','w').write('\n'.join(re.findall(r'<script>(.*?)</script>', s, re.S)))" "$f"
            node --check /tmp/x.js && echo "ok $f"
          done
      - name: Quality fallback unit tests
        run: node tools/webtest/qf-test.mjs
      - name: Live TV default view (stand-in playlist and guide snapshot; same expected file as the TV's LiveHomeTest)
        run: node tools/webtest/livehome-test.mjs
      - name: True Crime category (real TMDB fixture; same expected file as the TV's TrueCrimeTest)
        run: node tools/webtest/truecrime-test.mjs
      - name: Install Playwright Chromium
        working-directory: tools/webtest
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Headless checks (390 px and 1280 px)
        working-directory: tools/webtest
        run: |
          python3 srv.py &
          sleep 1
          node qa.mjs
      - name: Live TV rows in the browser (guide snapshots, pinned Philadelphia games, feeds, A-Z, search)
        working-directory: tools/webtest
        run: |
          curl -s -o /dev/null http://127.0.0.1:8781/index.html || (python3 srv.py &)
          sleep 1
          node livehome-qa.mjs
      - name: True Crime in the browser (Home row and Browse grid from the real TMDB capture)
        working-directory: tools/webtest
        run: |
          curl -s -o /dev/null http://127.0.0.1:8781/index.html || (python3 srv.py &)
          sleep 1
          node truecrime-qa.mjs
      - name: True Crime screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truecrime-web-screens
          path: tools/truecrime/qa/*.png
          if-no-files-found: ignore
      - name: Live TV screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livehome-web-screens
          path: tools/livehome/qa/*.png
          if-no-files-found: ignore
      - name: Extra guide for free streaming channels (real i.mjh.nz excerpt; provider guide keeps its rows)
        working-directory: tools/webtest
        run: |
          curl -s -o /dev/null http://127.0.0.1:8781/index.html || (python3 srv.py &)
          sleep 1
          node guide-extra-qa.mjs
      - name: Throttled quality fallback test (real HLS, 6 Mbps 4K and 1.9 Mbps 1080p, Chrome network throttling)
        working-directory: tools/webtest
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          bash mkstreams.sh
          # The server from the step above may still be up (same code; it reads the streams on each request).
          curl -s -o /dev/null http://127.0.0.1:8781/index.html || (python3 srv.py &)
          sleep 1
          node qf-net.mjs
