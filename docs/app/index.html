<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#02060A">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#05070D;--nav1:#0A1430;--nav2:#070B18;--card:#111827;--raised:#1A2335;--accent:#3D7BFF;--bright:#6EA0FF;
  --muted:#A3ADC2;--line:#1F2937;--ok:#1f9d55;--warn:#e0a526;--bad:#ff6b6b;
  --gut:16px;--pw:118px;--ww:240px;--hdr:56px;--tab:62px;
  --font:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (min-width:600px){:root{--pw:140px;--ww:280px}}
@media (min-width:900px){:root{--gut:40px;--pw:164px;--ww:320px;--hdr:68px;--tab:0px}}
@media (min-width:1500px){:root{--gut:56px;--pw:184px;--ww:360px}}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:#fff;font:15px/1.45 var(--font);overflow-x:hidden;
  background:linear-gradient(180deg,var(--nav1) 0,var(--nav2) 280px,var(--bg) 680px) no-repeat,var(--bg);
  padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--bright);outline-offset:3px;border-radius:8px}
.hidden{display:none!important}
.muted{color:var(--muted)}
h1,h2,h3{letter-spacing:-.3px;margin:0}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:50;height:var(--hdr);display:flex;align-items:center;gap:20px;padding:0 var(--gut);
  background:linear-gradient(180deg,rgba(5,7,13,.82),rgba(5,7,13,.55));backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid rgba(31,41,55,.55);padding-top:env(safe-area-inset-top);height:calc(var(--hdr) + env(safe-area-inset-top))}
.logo{font-weight:800;font-size:22px;letter-spacing:-.6px;white-space:nowrap}.logo b{color:var(--accent)}
nav.links{display:none;gap:4px}
nav.links a{padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px;transition:color .15s,background .15s}
nav.links a:hover{color:#fff}
nav.links a.on{color:#fff;background:rgba(255,255,255,.08)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.tvpill{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#555;flex:0 0 auto}
.dot.online{background:#2bd46e;box-shadow:0 0 8px #2bd46e}.dot.connecting{background:var(--warn)}.dot.offline{background:var(--bad)}
.iconbtn{display:none;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{color:#fff;background:rgba(255,255,255,.08)}
@media (min-width:900px){nav.links{display:flex}.iconbtn{display:flex}}
@media (max-width:420px){.tvpill .lbl{display:none}}
#tvpick{position:fixed;right:12px;top:calc(var(--hdr) + env(safe-area-inset-top) + 6px);z-index:80;width:min(92vw,380px);background:#061722;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#tvpick.hidden{display:none}#tvpick h3{margin:0 0 6px;font-size:14px}#tvpick ul{max-height:60vh;overflow:auto}#tvpick .netlist li{align-items:center}#tvpick .netlist li>span:nth-child(2){flex:1;min-width:0}

/* ---------- bottom tab bar (phones) ---------- */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;
  height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(5,7,13,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabbar a.on{color:#fff}nav.tabbar a.on svg{color:var(--bright)}
nav.tabbar svg{width:22px;height:22px}
@media (min-width:900px){nav.tabbar{display:none}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:11px 18px;font-weight:700;font-size:15px;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap;min-height:44px}
.btn:hover{background:rgba(255,255,255,.24)}
.btn:active{transform:scale(.98)}
.btn.primary{background:#fff;color:#05070D}
.btn.primary:hover{background:#e8eefc;box-shadow:0 0 0 2px var(--bright),0 0 18px rgba(110,160,255,.35)}
.btn.blue{background:var(--accent)}.btn.blue:hover{background:#5a8fff}
.btn.small{padding:7px 12px;font-size:13px;min-height:34px}
.btn[aria-pressed="true"]{background:rgba(61,123,255,.22);color:var(--bright)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px var(--gut) 8px;margin:0 calc(-1*var(--gut))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{color:#fff;border-color:#33415a}
.chip.on{background:#fff;color:#05070D;border-color:#fff}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--raised);color:#fff}

/* ---------- layout ---------- */
main#view{min-height:60vh}
.page{padding:18px var(--gut) 40px}
.page h1{font-size:26px;font-weight:800;margin:6px 0 14px}
@media (min-width:900px){.page{padding-top:28px}.page h1{font-size:34px}}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-h h2{font-size:19px;font-weight:700}

/* ---------- hero ---------- */
.hero{position:relative;margin-top:calc(-1*(var(--hdr) + env(safe-area-inset-top)));height:min(78vh,700px);min-height:440px;overflow:hidden;background:var(--card)}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;pointer-events:none}
.hero .slide.on{opacity:1;pointer-events:auto}
.hero .bd{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,rgba(5,7,13,.65) 38%,rgba(5,7,13,.1) 70%,rgba(5,7,13,.45) 100%),linear-gradient(90deg,rgba(5,7,13,.75),rgba(5,7,13,0) 60%)}
.hero .content{position:absolute;left:var(--gut);right:var(--gut);bottom:44px;max-width:640px}
.hero .kicker{color:var(--bright);font-weight:700;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:8px}
.hero h1{font-size:clamp(30px,6vw,56px);font-weight:800;line-height:1.02;letter-spacing:-1px;margin-bottom:10px;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.hero .meta{color:#d7deeb;font-size:14px;margin-bottom:10px}
.hero p{color:#d0d7e4;margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:560px}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap}
.hero .dots{position:absolute;right:var(--gut);bottom:20px;display:flex;gap:6px}
.hero .dots button{width:22px;height:4px;border-radius:2px;border:0;background:rgba(255,255,255,.3);cursor:pointer;padding:0}
.hero .dots button.on{background:#fff}
@media (max-width:599px){.hero{height:72vh;min-height:460px}.hero .content{bottom:36px}.hero .dots{left:var(--gut);right:auto;bottom:14px}}

/* ---------- rows ---------- */
.row{margin:18px 0 6px;position:relative}
.row-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--gut);margin-bottom:2px}
.row-h h2{font-size:18px;font-weight:700}
@media (min-width:900px){.row-h h2{font-size:21px}}
.row-h a{color:var(--muted);font-size:13px;font-weight:600}.row-h a:hover{color:#fff}
.scroller{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:12px var(--gut) 14px;scroll-padding:0 var(--gut);scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.scroller>*{scroll-snap-align:start}
@media (min-width:900px){.scroller{gap:14px}}
.arr{display:none;position:absolute;top:44px;bottom:14px;width:var(--gut);min-width:40px;border:0;background:linear-gradient(90deg,rgba(5,7,13,.85),rgba(5,7,13,0));color:#fff;font-size:30px;cursor:pointer;z-index:3;opacity:0;transition:opacity .2s}
.arr.r{right:0;background:linear-gradient(270deg,rgba(5,7,13,.85),rgba(5,7,13,0))}.arr.l{left:0}
@media (hover:hover) and (min-width:900px){.arr{display:block}.row:hover .arr{opacity:1}}
.row .empty{padding:8px var(--gut);color:var(--muted);font-size:14px}

/* ---------- cards ---------- */
.card{flex:0 0 auto;width:var(--pw);display:block}
.poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .22s ease,box-shadow .22s ease}
.poster img{width:100%;height:100%;object-fit:cover}
.poster .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:700;color:var(--muted);font-size:14px;background:linear-gradient(160deg,var(--raised),var(--card))}
.badge{position:absolute;left:6px;top:6px;background:rgba(5,7,13,.78);backdrop-filter:blur(6px);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700}
.badge .s{color:#f5c518}
.wlmark{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.cap{margin-top:7px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.card:hover .poster,.card:focus-visible .poster{transform:scale(1.05);box-shadow:0 0 0 2px var(--bright),0 10px 28px rgba(0,0,0,.55)}}
.card:focus-visible{outline:none}.card:focus-visible .poster{box-shadow:0 0 0 2px var(--bright)}
.wcard{flex:0 0 auto;width:var(--ww);position:relative}
.wcard a{display:block}
.wimg{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--card);transition:transform .22s ease,box-shadow .22s}
.wimg img{width:100%;height:100%;object-fit:cover}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}.prog i{display:block;height:100%;background:var(--accent)}
@media (hover:hover){.wcard:hover .wimg{transform:scale(1.04);box-shadow:0 0 0 2px var(--bright)}}
.wcard a:focus-visible .wimg{box-shadow:0 0 0 2px var(--bright)}
.miniplay{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(5,7,13,.72);backdrop-filter:blur(6px);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.miniplay:hover{background:#fff;color:#05070D}
.pcard{flex:0 0 auto;width:calc(var(--pw)*.78);text-align:center;display:block}
.pcard .face{aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--raised);transition:transform .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:var(--muted)}
.pcard .face img{width:100%;height:100%;object-fit:cover}
@media (hover:hover){.pcard:hover .face{transform:scale(1.05);box-shadow:0 0 0 2px var(--bright)}}
.pcard:focus-visible .face{box-shadow:0 0 0 2px var(--bright)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 10px}
.grid .card,.grid .pcard{width:auto}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 14px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(164px,1fr))}}

/* ---------- skeletons ---------- */
.sk{background:linear-gradient(90deg,#0f1522 0,#1A2335 45%,#0f1522 90%);background-size:220% 100%;animation:sh 1.3s linear infinite;border-radius:8px}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.sk-poster{flex:0 0 auto;width:var(--pw);aspect-ratio:2/3}
.sk-wide{flex:0 0 auto;width:var(--ww);aspect-ratio:16/9}
.sk-line{height:14px;margin:8px 0}
.grid .sk-poster{width:auto}

/* ---------- title page ---------- */
.tp{position:relative;margin-top:calc(-1*(var(--hdr) + env(safe-area-inset-top)))}
.tp-bd{position:relative;height:min(62vh,620px);min-height:300px;background:var(--card) center 20%/cover no-repeat}
.tp-bd::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 3%,rgba(5,7,13,.55) 45%,rgba(5,7,13,.2) 75%,rgba(5,7,13,.5)),linear-gradient(90deg,rgba(5,7,13,.8),rgba(5,7,13,0) 65%)}
.tp-inner{position:relative;display:flex;gap:28px;padding:0 var(--gut);margin-top:-150px;z-index:2;align-items:flex-end}
.tp-poster{display:none;flex:0 0 auto;width:220px;border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.6);aspect-ratio:2/3;background:var(--card)}
.tp-poster img{width:100%;height:100%;object-fit:cover}
.tp-info{flex:1;min-width:0;max-width:820px}
.tp-info h1{font-size:clamp(28px,5vw,50px);font-weight:800;line-height:1.05;letter-spacing:-.8px;margin-bottom:8px}
.tp-meta{color:#d7deeb;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
.scores{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.score{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:13px;font-weight:700}
.score .k{color:var(--muted);font-weight:600}
.score.imdb .k{color:#f5c518}.score.rt .k{color:#fa6b4a}
.tagline{color:var(--bright);font-style:italic;margin:4px 0 8px}
.overview{color:#d0d7e4;margin:0 0 16px;max-width:760px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.prov{color:var(--muted);font-size:13px;margin-top:4px}
.prov b{color:#fff;font-weight:600}
@media (min-width:900px){.tp-poster{display:block}.tp-inner{margin-top:-240px}}
@media (max-width:599px){.tp-bd{height:56vw;min-height:240px}.tp-inner{margin-top:-60px}.actions .btn{flex:1 1 auto}}
.trailer{position:relative;display:block;width:100%;max-width:880px;aspect-ratio:16/9;border:0;padding:0;border-radius:10px;overflow:hidden;background:#000;cursor:pointer}
.trailer img{width:100%;height:100%;object-fit:cover;opacity:.75;transition:opacity .2s}
.trailer:hover img{opacity:.9}
.trailer .pb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.92);color:#05070D;display:flex;align-items:center;justify-content:center;font-size:24px;padding-left:4px}
.trailer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.eps{display:flex;flex-direction:column;gap:12px}
.ep{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;align-items:flex-start}
.ep .still{flex:0 0 auto;width:150px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--raised)}
.ep .still img{width:100%;height:100%;object-fit:cover}
.ep .body{flex:1;min-width:0}
.ep .t{font-weight:700}
.ep .d{color:var(--muted);font-size:12px;margin:2px 0 4px}
.ep .o{color:#c8d0dd;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.ep .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ep.resume{border-color:var(--accent)}
@media (min-width:900px){.ep .still{width:220px}}
@media (max-width:420px){.ep .still{width:116px}}

/* ---------- person ---------- */
.pp{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.pp .ph{width:140px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--card);flex:0 0 auto}
.pp .ph img{width:100%;height:100%;object-fit:cover}
.pp .info{flex:1;min-width:240px}
.bio{color:#d0d7e4;white-space:pre-line;max-width:820px}
.bio.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;color:var(--bright);font-weight:700;cursor:pointer;padding:4px 0}
@media (min-width:900px){.pp .ph{width:200px}}

/* ---------- browse ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:84px;padding:14px;border-radius:10px;background:linear-gradient(140deg,var(--raised),var(--card));border:1px solid var(--line);font-weight:800;font-size:16px;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.tile small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.tile::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(var(--glow,rgba(61,123,255,.35)),transparent 70%)}
@media (hover:hover){.tile:hover{transform:translateY(-2px);border-color:var(--bright);box-shadow:0 8px 24px rgba(0,0,0,.4)}}
.svc{min-height:72px;font-size:17px;color:#fff;border:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
select,input[type=text],input[type=search],input[type=password],input[type=url]{background:#0B1220;color:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px}
select:focus-visible,input:focus-visible{outline:2px solid var(--bright);outline-offset:1px}
.more{display:flex;justify-content:center;margin:24px 0}

/* ---------- search ---------- */
.searchbox{position:relative;margin-bottom:16px}
.searchbox input{width:100%;font-size:18px;padding:14px 16px 14px 46px;border-radius:10px;background:var(--card)}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}

/* ---------- panels, settings, pairing ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;max-width:760px}
.panel h2{font-size:18px;margin-bottom:6px}
.panel p{margin:6px 0}
.panel label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}
.panel .rowf{display:flex;gap:8px;flex-wrap:wrap}.panel .rowf input,.panel .rowf select{flex:1;min-width:180px}
.steps{margin:10px 0;padding-left:22px}.steps li{margin:8px 0}
/* Settings: an overview list of categories, one page per category. Wide screens: list left, category right.
   Spacing scale 4 / 8 / 12 / 16 / 24 / 32. Type: h1 page, h2 group, 15 body, 13 secondary. */
.settings{max-width:1100px}
.settings h1{margin-bottom:16px}
.slist{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:760px}
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px;border-top:1px solid rgba(255,255,255,.06);transition:background .15s}
.srow:first-child{border-top:0}
.srow:hover{background:rgba(255,255,255,.04)}
.srow.on{background:rgba(61,123,255,.14)}
.srow .stext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.srow .stext b{font-size:16px}
.srow .stext .muted{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .chev{color:var(--muted);font-size:22px;line-height:1}
.sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}.sdot.ok{background:#2bd46e}.sdot.no{background:#4b5563}
.sback{display:inline-block;color:var(--bright);font-weight:700;margin-bottom:12px;padding:4px 0}
.settings.has-cat .spane-list{display:none}
.sgroup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;max-width:760px}
.sgroup h2{font-size:17px;margin-bottom:8px}
.sgroup p{margin:8px 0}
.sgroup label{display:block;color:var(--muted);font-size:13px;margin:12px 0 4px}
.sgroup label.switch,.sgroup label.rowf{color:#fff;font-size:15px}
.sgroup .rowf{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sgroup .rowf input,.sgroup .rowf select{flex:1;min-width:180px}
.sgroup .profrow{display:flex;gap:8px;flex-wrap:wrap}
.sgroup.danger{border-color:rgba(255,107,107,.35)}
.kv{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
.kv:first-of-type{border-top:0}
.kv>span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.btn.danger{background:transparent;color:#ff9b9b;box-shadow:inset 0 0 0 1px rgba(255,107,107,.55)}
.btn.danger:hover{background:rgba(255,107,107,.14)}
details.replace{margin-top:12px}
details.replace>summary{list-style:none;display:inline-flex}
details.replace>summary::-webkit-details-marker{display:none}
details.replace[open]>summary{background:rgba(61,123,255,.22);color:var(--bright)}
@media (min-width:900px){
  .settings{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start}
  .settings.has-cat .spane-list{display:block;position:sticky;top:calc(var(--hdr) + 16px)}
  .settings .slist{max-width:none}
  .sback{display:none}
}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:#1F2937}
.pill.ok{background:rgba(31,157,85,.25);color:#5fd38a}.pill.no{background:rgba(255,107,107,.15);color:#ff9b9b}
.notice{max-width:760px;margin:30px auto;text-align:center;padding:30px 18px}
.notice h2{font-size:22px;margin-bottom:8px}
.notice .actions{justify-content:center}
.spinner{width:32px;height:32px;border:3px solid var(--raised);border-top-color:var(--bright);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 16px);transform:translate(-50%,20px);z-index:90;max-width:min(92vw,520px);
  background:var(--raised);border:1px solid #2b3a55;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(43,212,110,.6)}#toast.warn{border-color:rgba(224,165,38,.7)}
footer{padding:30px var(--gut) 40px;color:#59637a;font-size:12px}

/* ---------- play here: sources ---------- */
.srchead{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.srchead .lbl{color:var(--muted);font-size:14px}
.srcstatus{min-height:22px;margin:8px 0;font-weight:600;font-size:14px;color:var(--bright)}
.srcstatus.bad{color:var(--bad)}
.srcs{display:flex;flex-direction:column;gap:6px;max-width:980px}
.src{display:flex;align-items:center;flex-wrap:wrap;gap:6px 9px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:13px;min-height:46px}
.src:hover,.src:focus-visible{background:var(--raised);border-color:#33415a}
.src[disabled]{opacity:.55;cursor:progress}
.src .st{letter-spacing:1px;color:var(--bright);white-space:nowrap}.src .st i{font-style:normal;color:rgba(255,255,255,.18)}
.src .bdg{background:#2A3550;border-radius:4px;padding:1px 7px;font-size:12px;font-weight:700;white-space:nowrap}
.src .bdg.hi{background:#1d3f8f}
.src .so{color:var(--muted);font-size:12px}
.src .sz{font-weight:600;white-space:nowrap}
.src .in{color:var(--bright);font-weight:700;white-space:nowrap}
.src .dl{color:var(--muted);white-space:nowrap}
.src .badsrc{background:#7a1f1f;color:#fff}
.src .ad{margin-left:auto;color:var(--muted);opacity:.75;font-size:11px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcmore{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 12px;cursor:pointer;font-size:13px;border-radius:8px}
.srcmore:hover{color:#fff;background:rgba(255,255,255,.05)}
@media (min-width:900px){.src{flex-wrap:nowrap}}

/* ---------- play here: player ---------- */
body.playmode{padding-bottom:0;background:#000}
body.playmode header.top,body.playmode nav.tabbar{display:none}
.player{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#000;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.pl-top{display:flex;align-items:center;gap:12px;padding:10px 16px}
.pl-back{flex:0 0 auto;font-weight:700;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.1)}
.pl-back:hover{background:rgba(255,255,255,.2)}
.pl-title{min-width:0;display:flex;flex-direction:column}
.pl-title b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.pl-title span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:200px}
.pl-stage video{width:100%;max-height:calc(100dvh - 150px);background:#000;aspect-ratio:16/9}
/* Phone turned sideways: the video fills the screen (turn back upright for the buttons). */
@media (orientation:landscape) and (max-height:540px){body.playmode .pl-top,body.playmode .pl-bar{display:none}body.playmode .player{padding:0}body.playmode .pl-stage video{max-height:100dvh;height:100dvh;aspect-ratio:auto}}
.pl-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(90%,460px);text-align:center;background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:12px;padding:18px}
.pl-msg p{margin:0 0 12px}
/* iPhone blocks autoplay: one big button starts the video (the tap counts as permission). */
.qlog{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
.pl-note{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);max-width:min(90%,420px);padding:8px 14px;background:rgba(17,24,39,.92);border:1px solid rgba(43,212,110,.6);border-radius:10px;color:#fff;font-size:14px;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.pl-note.on{opacity:1;transform:translate(-50%,0)}
.pl-tap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;z-index:2}
.pl-tap i{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;background:rgba(17,24,39,.85);box-shadow:0 0 0 3px var(--bright),0 8px 30px rgba(0,0,0,.6);font-style:normal;font-size:40px;padding-left:6px}
/* Settings > Check network */
.netlist{list-style:none;margin:10px 0 0;padding:0}.netlist li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid rgba(255,255,255,.06)}
.netlist li:first-child{border-top:0}.netlist .pill{flex:0 0 auto;min-width:44px;text-align:center}.netlist b{display:block}.netlist span.muted{font-size:13px}
.pl-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px 16px 18px}
.btn.big{font-size:17px;padding:14px 26px;min-height:52px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Jarvis HUD skin ---------- */
:root{--bg:#02060A;--nav1:#031018;--nav2:#02080D;--card:rgba(6,23,34,.85);--raised:#0A2230;--accent:#00E5FF;--bright:#7DF9FF;--muted:#8FB8C4;--line:#0E6A7A;--ok:#00E5FF;--warn:#FFB300;--bad:#FF4D6D;--ink:#02060A;--white:#EAFBFF;
  --font:Rajdhani,"Arial Narrow",Arial,sans-serif;--disp:Orbitron,Rajdhani,Arial,sans-serif;
  --cut:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);--cut-s:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
body{color:var(--white);font-size:16px;
  background:linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px) 0 0/40px 40px,
  radial-gradient(ellipse at 50% 35%,transparent 55%,rgba(0,0,0,.55)) fixed,linear-gradient(180deg,var(--nav1) 0,var(--nav2) 280px,var(--bg) 680px) no-repeat,var(--bg)}
:focus-visible{outline:2px solid var(--accent);border-radius:0}
h1,h2,h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:1.5px}
header.top{background:linear-gradient(180deg,rgba(2,6,10,.85),rgba(2,6,10,.55));border-bottom:1px solid rgba(14,106,122,.6)}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:3px;color:var(--white);text-shadow:0 0 12px rgba(0,229,255,.75)}
.logo .ring{flex:0 0 auto;filter:drop-shadow(0 0 4px rgba(0,229,255,.6))}
nav.links a{font-family:var(--disp);font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;border-radius:0;position:relative}
nav.links a:hover{color:var(--bright)}
nav.links a.on{color:var(--accent);background:transparent}
nav.links a.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:1.5px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.tvpill{border-radius:0;clip-path:var(--cut-s);background:rgba(6,23,34,.85);border-color:var(--line);font-family:var(--disp);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.dot.online{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.iconbtn{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.iconbtn:hover{color:var(--ink);background:var(--accent)}
nav.tabbar{background:rgba(2,6,10,.94);border-top-color:var(--line)}
nav.tabbar a{font-family:var(--disp);font-size:9px;letter-spacing:1px;text-transform:uppercase}
nav.tabbar a.on{color:var(--accent)}nav.tabbar a.on svg{color:var(--accent);filter:drop-shadow(0 0 4px rgba(0,229,255,.7))}

/* buttons: chamfered, uppercase */
.btn{border-radius:0;clip-path:var(--cut-s);background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px rgba(0,229,255,.75);
  font-family:var(--font);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.btn:hover,.btn:focus-visible{background:var(--accent);color:var(--ink);box-shadow:none;outline:none}
.btn.primary{background:var(--accent);color:var(--ink);box-shadow:none}
.btn.primary:hover,.btn.primary:focus-visible{background:var(--bright);color:var(--ink);box-shadow:none}
.btn.blue{background:var(--accent);color:var(--ink)}.btn.blue:hover{background:var(--bright)}
.btn[aria-pressed="true"]{background:rgba(0,229,255,.18);color:var(--bright)}
.chip{border-radius:0;clip-path:var(--cut-s);font-family:var(--font);text-transform:uppercase;letter-spacing:.8px}
.chip:hover{color:var(--bright);border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.seg{border-radius:0;clip-path:var(--cut-s)}.seg button{border-radius:0;text-transform:uppercase;letter-spacing:.8px}
.seg button.on{background:var(--accent);color:var(--ink)}
.linkbtn{color:var(--accent)}

/* headings */
.page h1{font-size:22px;font-weight:700}
@media (min-width:900px){.page h1{font-size:28px}}
.section-h h2,.row-h h2,.panel h2{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
@media (min-width:900px){.row-h h2{font-size:14px}}
.section-h h2::before,.row-h h2::before,.panel h2::before{content:"\25B8";color:var(--accent)}
.row-h h2::after,.section-h h2::after{content:"";width:40px;height:1px;background:var(--accent)}
.row-h a{font-family:var(--disp);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}

/* hero and title page: duotone backdrop with scanlines */
.hero .bd,.tp-bd{filter:saturate(.35)}
.hero .bd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(125,249,255,.04) 0 1px,transparent 1px 3px),rgba(0,229,255,.15)}
.tp-bd::before{content:"";position:absolute;inset:0;z-index:1;background:repeating-linear-gradient(0deg,rgba(125,249,255,.04) 0 1px,transparent 1px 3px),rgba(0,229,255,.12)}
.hero .kicker{font-family:var(--disp);font-weight:500;font-size:10px;letter-spacing:2px;color:var(--accent)}
.hero .kicker::before{content:"\25B8  "}
.hero h1{font-size:clamp(24px,4.4vw,44px);font-weight:700;letter-spacing:1px;line-height:1.08;text-shadow:0 0 20px rgba(0,229,255,.35)}
.tp-info h1{font-size:clamp(22px,3.8vw,40px);font-weight:700;letter-spacing:1px;line-height:1.1}
.hero .meta,.tp-meta{color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.hero p,.overview,.bio{color:#cfe9f0}
.hero .dots button{border-radius:0;height:3px;background:var(--line)}.hero .dots button.on{background:var(--accent)}
.tagline{color:var(--accent)}

/* cards: chamfered with a hairline, corner brackets and a cyan glow on hover / focus */
.poster,.wimg,.tile,.ep,.src,.panel,.trailer,.tp-poster,.pp .ph,.ep .still,.score,.badge,.pill,.sk,.pl-msg,#toast,.searchbox input{border-radius:0;clip-path:var(--cut)}
.score,.badge,.pill,.ep .still{clip-path:var(--cut-s)}
.poster,.wimg{box-shadow:none}
.poster::after,.wimg::after,.tile::after,.panel::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(14,106,122,.85);transition:border-color .15s}
.panel{position:relative}
.panel::after{background:linear-gradient(var(--bright),var(--bright)) left 5px top 5px/12px 2px no-repeat,linear-gradient(var(--bright),var(--bright)) left 5px top 5px/2px 12px no-repeat,linear-gradient(var(--bright),var(--bright)) right 5px top 5px/12px 2px no-repeat,linear-gradient(var(--bright),var(--bright)) right 5px top 5px/2px 12px no-repeat,linear-gradient(var(--bright),var(--bright)) left 5px bottom 5px/12px 2px no-repeat,linear-gradient(var(--bright),var(--bright)) left 5px bottom 5px/2px 12px no-repeat,linear-gradient(var(--bright),var(--bright)) right 5px bottom 5px/12px 2px no-repeat,linear-gradient(var(--bright),var(--bright)) right 5px bottom 5px/2px 12px no-repeat;opacity:.55}
.poster::after,.wimg::after,.tile::after{background:linear-gradient(var(--bright),var(--bright)) left 5px top 5px/12px 2px no-repeat,linear-gradient(var(--bright),var(--bright)) left 5px top 5px/2px 12px no-repeat,linear-gradient(var(--bright),var(--bright)) right 5px top 5px/12px 2px no-repeat,linear-gradient(var(--bright),var(--bright)) right 5px top 5px/2px 12px no-repeat,linear-gradient(var(--bright),var(--bright)) left 5px bottom 5px/12px 2px no-repeat,linear-gradient(var(--bright),var(--bright)) left 5px bottom 5px/2px 12px no-repeat,linear-gradient(var(--bright),var(--bright)) right 5px bottom 5px/12px 2px no-repeat,linear-gradient(var(--bright),var(--bright)) right 5px bottom 5px/2px 12px no-repeat;background-size:0 0;}
@media (hover:hover){
  .card:hover .poster,.wcard:hover .wimg{transform:scale(1.05);box-shadow:none}
  .card:hover,.wcard:hover,.tile:hover{filter:drop-shadow(0 0 8px rgba(0,229,255,.45))}
  .card:hover .poster::after,.wcard:hover .wimg::after,.tile:hover::after{border:1.5px solid var(--accent);background-size:12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px}
  .tile:hover{border-color:var(--accent);box-shadow:none}
}
.card:focus-visible{filter:drop-shadow(0 0 8px rgba(0,229,255,.45))}
.card:focus-visible .poster{transform:scale(1.05);box-shadow:none}
.wcard a:focus-visible .wimg{box-shadow:none}
.card:focus-visible .poster::after,.wcard a:focus-visible .wimg::after{border:1.5px solid var(--accent);background-size:12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px,12px 2px,2px 12px}
.cap{font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge{background:rgba(2,6,10,.8);border:1px solid var(--line)}
.wlmark{background:rgba(2,6,10,.8);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.prog{background:rgba(14,106,122,.5)}.prog i{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.miniplay{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.miniplay:hover{background:var(--accent);color:var(--ink)}
.pcard .face{box-shadow:0 0 0 1px var(--line)}
@media (hover:hover){.pcard:hover .face{box-shadow:0 0 0 2px var(--accent),0 0 14px rgba(0,229,255,.5)}}
.pcard:focus-visible .face{box-shadow:0 0 0 2px var(--accent),0 0 14px rgba(0,229,255,.5)}
.tile{background:linear-gradient(140deg,var(--raised),rgba(6,23,34,.85));border-color:var(--line);font-family:var(--disp);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.tile small{font-family:var(--font);text-transform:none;letter-spacing:0;font-size:13px}
.tile::before{background:radial-gradient(var(--glow,rgba(0,229,255,.3)),transparent 70%)}
.score{background:rgba(2,6,10,.7);border-color:var(--line);font-family:var(--disp);font-size:11px;letter-spacing:.5px}
.score .k{color:var(--accent)}
.ep{background:var(--card);border-color:var(--line)}
.ep.resume{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ep .t{text-transform:uppercase;letter-spacing:.5px}
.trailer .pb{background:var(--accent);color:var(--ink);box-shadow:0 0 18px rgba(0,229,255,.6)}
.panel{background:var(--card);border-color:var(--line)}
.pill{background:var(--raised)}.pill.ok{background:rgba(0,229,255,.18);color:var(--accent)}.pill.no{background:rgba(255,77,109,.15);color:#FF4D6D}
select,input[type=text],input[type=search],input[type=password],input[type=url]{border-radius:0;clip-path:var(--cut-s);background:rgba(2,6,10,.7);color:var(--white);border-color:var(--line)}
select:focus-visible,input:focus-visible{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.searchbox svg{color:var(--accent)}
.sk{background:linear-gradient(90deg,#061722 0,#0A2230 45%,#061722 90%);background-size:220% 100%}

/* loading: two arcs turning in opposite directions */
.spinner{position:relative;border:2px solid transparent;border-top-color:var(--accent);border-bottom-color:rgba(0,229,255,.35)}
.spinner::after{content:"";position:absolute;inset:5px;border:2px solid transparent;border-left-color:var(--bright);border-right-color:var(--bright);border-radius:50%;animation:spin 1.1s linear infinite reverse}

#toast{background:rgba(6,23,34,.95);border-color:var(--accent);font-family:var(--font);letter-spacing:.5px}
#toast.ok{border-color:var(--accent)}#toast.warn{border-color:var(--warn)}
footer{color:var(--muted)}

.src{background:var(--card);border-color:var(--line)}
.src:hover,.src:focus-visible{background:var(--raised);border-color:var(--accent)}
.src .st,.src .in{color:var(--accent)}.src .st i{color:rgba(234,251,255,.18)}
.src .bdg{background:var(--raised);border-radius:0;box-shadow:inset 0 0 0 1px var(--line)}.src .bdg.hi{background:#0B5F6E}
.srcstatus{color:var(--accent)}
.pl-back{border-radius:0;clip-path:var(--cut-s);color:var(--accent);background:transparent;box-shadow:inset 0 0 0 1px var(--accent);text-transform:uppercase;letter-spacing:1px}
.pl-back:hover{background:var(--accent);color:var(--ink)}
.pl-msg{background:rgba(6,23,34,.95);border-color:var(--accent)}
/* Ask Jarvis (Search page) */
.search-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.search-h h1{margin-bottom:10px}
.askp{max-width:none;margin-bottom:18px}
.ask-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ask-h h2{font-family:var(--font);text-transform:uppercase;letter-spacing:2px;font-size:18px;margin:0;color:var(--white)}
.ask-h p{margin:2px 0 0;font-size:14px}
.ask-h svg{flex:0 0 auto}
.ask-row{display:flex;gap:10px}

  const save = (a) => { if (a.length) LS.set(KEY, JSON.stringify(a.slice(-MAX))); else LS.del(KEY); };

  async function send(cmd, pid) {

    if (!S.link || !S.key) { save([...load().filter((x) => !same(x, pid, cmd.type, cmd.id)), item]); later(); return; }
    let req;
    try { req = await post(item); } catch { later(); return; }

    if (!S.link || !S.key || S.status !== "online" || Date.now() - lastFlush < 30000) return;

      const t = x.cmd.type, id = +x.cmd.id;

    const req = newReq();

      <div class="pl-msg hidden" id="plMsg"><p id="plMsgText"></p><div class="rowf" style="justify-content:center;gap:8px;flex-wrap:wrap">${vlcBtn}<a class="btn small${vlcBtn ? "" : " primary"}" id="plOther" href="${esc(P.back)}">Pick another source</a></div></div></div>
    <div class="pl-bar"><button class="btn primary big" id="fsBtn">&#9974; Full screen</button>
      <a class="btn" href="${esc(P.back)}">Other sources</a>${vlcBtn.replace("btn small primary", "btn")}
      <button class="btn" ${playAttrs({ type, id, name: m.name }, m.season, m.episode)}>&#9654; Play on TV instead</button></div></div>`;
  const vid = $("#vid", v), msg = $("#plMsg", v);

  async function stepDown(why) {

  });

}

// ---------- Person page ----------
async function renderPerson(v, tok, id) {
  v.innerHTML = `<div class="page"><div class="pp"><div class="ph sk"></div><div class="info"><div class="sk sk-line" style="width:50%;height:32px"></div><div class="sk sk-line" style="width:30%"></div><div class="sk sk-line"></div><div class="sk sk-line" style="width:85%"></div></div></div></div>`;

  try { o = await api.person(id); } catch (e) {
    if (tok === routeTok) v.innerHTML = `<div class="notice"><h2>Couldn't load</h2><p class="muted">${esc(e.message)}</p></div>`;
    return;
  }
  if (tok !== routeTok) return;
  if (o.adult) { v.innerHTML = `<div class="notice"><h2>Not available</h2></div>`; return; }
  document.title = (o.name || "Person") + " | Jarvis";
  const cr = o.combined_credits || {};
  // Their whole catalogue, like the TV's person page (not origin-filtered; adult titles still removed).
  const acting = [];
  const seenA = new Set();
  for (const j of cr.cast || []) {
    const t = norm(j, null); if (!t) continue;
    if (t.type === "tv" && /self/i.test(j.character || "") && (j.episode_count || 0) <= 1) continue;
    const k = t.type + ":" + t.id; if (seenA.has(k)) continue; seenA.add(k);
    t.votes = j.vote_count || 0; acting.push(t);
  }
  const crewMap = new Map();
  for (const j of cr.crew || []) {
    const t = norm(j, null); if (!t) continue;
    const k = t.type + ":" + t.id;
    if (!crewMap.has(k)) { t.jobs = []; crewMap.set(k, t); }
    const e = crewMap.get(k); if (j.job && !e.jobs.includes(j.job)) e.jobs.push(j.job);
  }
  const crew = Array.from(crewMap.values());
  const byYear = (a, b) => (b.year || "0000").localeCompare(a.year || "0000");
  acting.sort(byYear); crew.sort(byYear);
  const known = (o.known_for_department === "Acting" ? acting : crew.length ? crew : acting).slice().sort((a, b) => b.votes - a.votes).slice(0, 16);
  const facts = [o.known_for_department, o.birthday ? "Born " + fmtDate(o.birthday) + (o.deathday ? ", died " + fmtDate(o.deathday) : "") : "", o.place_of_birth].filter(Boolean);
  const tabs = [["acting", "Acting", acting], ["crew", "Behind the camera", crew]].filter((x) => x[2].length);
  v.innerHTML = `<div class="page"><div class="pp"><div class="ph">${imgTag(o.profile_path, "w342", o.name)}</div>
    <div class="info"><h1 style="margin-top:0">${esc(o.name)}</h1><div class="muted" style="margin-bottom:10px">${esc(facts.join("  ·  "))}</div>
    ${o.biography ? `<div class="bio clamp" id="bio">${esc(o.biography)}</div><button class="linkbtn" id="bioMore">Read more</button>` : ""}</div></div></div>
    ${known.length ? `<section class="row"><div class="row-h"><h2>Known For</h2></div><button class="arr l" tabindex="-1" aria-label="Scroll left">&#8249;</button><div class="scroller">${known.map(posterCard).join("")}</div><button class="arr r" tabindex="-1" aria-label="Scroll right">&#8250;</button></section>` : ""}
    <div class="page" style="padding-top:0">
      <div class="section-h"><h2>Filmography</h2>${tabs.length > 1 ? `<div class="seg" id="ftabs">${tabs.map((x, i) => `<button class="${i ? "" : "on"}" data-tab="${x[0]}">${x[1]} (${x[2].length})</button>`).join("")}</div>` : ""}</div>
      <div id="filmo"></div></div>`;
  const filmo = $("#filmo", v);
  const card = (t) => { const c = posterCard(t); return t.jobs ? c.replace(/<div class="sub">[^<]*<\/div>/, `<div class="sub">${esc(t.jobs.join(", "))}</div>`) : c; };
  const showTab = (k) => {
    const tb = tabs.find((x) => x[0] === k) || tabs[0];
    filmo.innerHTML = tb ? `<div class="grid">${tb[2].map(card).join("")}</div>` : `<p class="muted">No credits listed.</p>`;
    $$("#ftabs button", v).forEach((b) => b.classList.toggle("on", tb && b.dataset.tab === tb[0]));
  };
  showTab(tabs[0] ? tabs[0][0] : "");
  const ft = $("#ftabs", v); if (ft) ft.addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
  const bm = $("#bioMore", v);
  if (bm) {
    const bio = $("#bio", v);
    requestAnimationFrame(() => { if (bio.scrollHeight <= bio.clientHeight + 4) bm.remove(); });
    bm.addEventListener("click", () => { const c = bio.classList.toggle("clamp"); bm.textContent = c ? "Read more" : "Show less"; });
  }
}

// ---------- Settings > Check network ----------
// One request per service, each with a short time limit, all at once. Results name hosts only: addon links and
// keys are never shown. No polling: a second tap while it runs does nothing.
const NET_BLOCKED = "Blocked or not answering. A VPN or iCloud Private Relay may be blocking this. Turn them off for Wi-Fi and try again.";
let netRunning = false;
async function netProbe(url, ms, opts) {
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms || 6000);
  const t0 = Date.now();
  try { const r = await fetch(url, { cache: "no-store", ...(opts || {}), signal: ac.signal }); return { r, ms: Date.now() - t0 }; }
  catch (e) { return { err: ac.signal.aborted ? "timeout" : "network", ms: Date.now() - t0 }; }
  finally { clearTimeout(t); }
}
async function netCheck() {
  const ul = $("#netList"), btn = $("#netBtn");
  if (!ul || netRunning) return;
  netRunning = true; if (btn) btn.disabled = true;
  const host = (u) => { try { return new URL(u).host; } catch { return "addon"; } };
  const rows = [];
  const draw = () => { if (ul.isConnected) ul.innerHTML = rows.map((x) => `<li><span class="pill ${x.ok === true ? "ok" : x.ok === false ? "no" : ""}">${x.ok === true ? "OK" : x.ok === false ? "Fail" : "…"}</span>
    <div><b>${esc(x.name)}</b><span class="muted">${esc(x.note || "Checking…")}</span></div></li>`).join(""); };
  const job = (name, fn) => {
    const x = { name, ok: null, note: "" }; rows.push(x);
    return (async () => { try { Object.assign(x, await fn()); } catch { Object.assign(x, { ok: false, note: NET_BLOCKED }); } draw(); })();
  };
  const fail = (res, what) => res.err === "timeout" ? { ok: false, note: "No answer in time. " + NET_BLOCKED } : { ok: false, note: what || NET_BLOCKED };
  const jobs = [];
  jobs.push(job("TMDB (posters and info)", async () => {
    const k = keys().tmdb;
    if (!k) { const res = await netProbe(TMDB + "/configuration", 6000, { mode: "no-cors" }); return res.r ? { ok: true, note: "Reachable. No TMDB key on this device yet." } : fail(res); }
    const p = new URLSearchParams(); const headers = {};
    if (k.length > 40) headers.Authorization = "Bearer " + k; else p.set("api_key", k);
    const res = await netProbe(TMDB + "/configuration?" + p, 6000, { headers });
    if (!res.r) return fail(res);
    if (res.r.status === 401) return { ok: false, note: "Reachable, but the TMDB key was rejected. Check it below." };
    return res.r.ok ? { ok: true, note: "Working (" + res.ms + " ms)." } : { ok: false, note: "TMDB answered with error " + res.r.status + ". Try again later." };
  }));
  const addons = addonUrls();
  if (!addons.length) rows.push({ name: "Addons", ok: false, note: "No addons on this device yet. Open Jarvis with a TV on, or add one above." });
  addons.forEach((u) => jobs.push(job("Addon: " + host(u), async () => {
    const res = await netProbe(u, 8000);
    if (!res.r) return fail(res);
    if (res.r.status === 403 || res.r.status === 429) return { ok: false, note: "Refused (" + res.r.status + "). " + NET_BLOCKED };
    if (!res.r.ok) return { ok: false, note: "The addon answered with error " + res.r.status + ". It may be down. Try again later." };
    let name = ""; try { name = String((await res.r.json()).name || "").trim(); } catch { return { ok: false, note: "The addon answered, but not with a manifest. Check its link." }; }
    return { ok: true, note: (name ? name + ": " : "") + "working (" + res.ms + " ms)." };
  })));
  // The relay's home page: a plain static file, no function call. no-cors: only "can this phone reach it" matters.
  jobs.push(job("Jarvis relay (Real-Debrid, house sync)", async () => {
    const res = await netProbe("https://jarvis-rd.netlify.app/", 6000, { mode: "no-cors" });
    return res.r ? { ok: true, note: "Reachable (" + res.ms + " ms)." } : fail(res);
  }));
  if (rdHere()) jobs.push(job("Real-Debrid on this device", async () => {
    try { await rdCall("GET", "/user"); return { ok: true, note: "Signed in and working." }; }
    catch (e) { return { ok: false, note: e.message || NET_BLOCKED }; }
  }));
  // Your IPTV provider's on-demand library (through the relay; the 24-hour index when it is fresh).
  if (IV.has()) jobs.push(job("IPTV movies and shows", async () => {
    let c = null; try { c = await IV.counts(); } catch {}
    if (!c) return { ok: false, note: "Couldn't load your IPTV provider's library. Try again in a minute." };
    const n = (x) => Number(x || 0).toLocaleString("en-US");
    return c.movies || c.shows ? { ok: true, note: `${n(c.movies)} movies, ${n(c.shows)} shows.` } : { ok: false, note: "Your IPTV provider lists no movies or shows." };
  }));
  jobs.push(job("TV link (ntfy.sh)", async () => {
    const res = await netProbe(RELAY + "v1/health", 6000);
    if (!res.r) return fail(res);
    return res.r.ok ? { ok: true, note: "Reachable (" + res.ms + " ms)." } : { ok: false, note: "The TV link answered with error " + res.r.status + ". It may be busy. Try again in a minute." };
  }));
  if (S.link && S.key) jobs.push(job("Your TV", async () => (await tvAlive(6000))
    ? { ok: true, note: "Answering." }
    : { ok: false, note: "Not answering. Turn the TV on and open Jarvis. Real-Debrid on this device plays without the TV." }));
  draw();
  try { await Promise.all(jobs); } finally {
    netRunning = false; if (btn && btn.isConnected) btn.disabled = false;
    const bad = rows.filter((x) => x.ok === false).length;
    toast(bad ? bad + (bad === 1 ? " check failed" : " checks failed") : "Network looks good", bad ? "warn" : "ok");
  }
}

// ---------- moving setup between Safari and the Home Screen app ----------
// iPhone gives a Home Screen app its own storage, separate from Safari's. "Copy setup" packs this device's Jarvis
// settings into one link; pasting it in the other one restores them (TV link, Real-Debrid, addons, profile, keys).
const SETUP_KEYS = () => [LINK_KEY, INIT_KEY, PROFILE_KEY, PLISTS_KEY, JKEY, JLOCAL, RDC_KEY, RDT_KEY, ADDON_BAK, ADDON_MINE, EXT_KEY,
  "mcdtv_web_tmdb", "mcdtv_web_mdb", "mcdtv_web_origin"];
function setupLink() {
  const o = {};
  for (const k of SETUP_KEYS()) { const v = LS.get(k); if (v != null && v !== "") o[k] = v; }
  return location.origin + location.pathname + "#setup." + b64u.enc(new TextEncoder().encode(JSON.stringify(o)));
}
// An invite is a setup link for someone else's phone: everything except this device's Real-Debrid sign-in,
// with the profile they will watch as. Opening it in Safari sets that browser up; the Home Screen app then
// takes it with one tap (Paste invite), since iPhone keeps the app's storage apart from Safari's.
const INVITE_KEY = "mcdtv_web_invite", WELCOME_KEY = "mcdtv_web_welcome";
async function inviteLink(pid, withToken) {
  const o = {};
  // The Real-Debrid API token goes along only when ticked (then the invite is as good as your password).
  for (const k of SETUP_KEYS()) { if (k === RDC_KEY || (k === RDT_KEY && !withToken)) continue; const v = LS.get(k); if (v != null && v !== "") o[k] = v; }
  o[PROFILE_KEY] = pid;
  return (await shortInvite(o)) || location.origin + location.pathname + "#invite." + b64u.enc(new TextEncoder().encode(JSON.stringify(o)));
}
// Short invite: "#j.<id>.<key>". The setup is encrypted with <key> and kept on the Jarvis relay for 7 days
// (rd-proxy/netlify/functions/invite.mts), so the link is short enough to text. Long links still work.
const INVITE_RELAY = "https://jarvis-rd.netlify.app/invite";
const SHORT_INV = /#j\.([A-Za-z0-9_-]{16,40})\.([A-Za-z0-9_-]{40,})/;
const isInvite = (t) => /#(setup|invite)\.[A-Za-z0-9_-]{20,}/.test(String(t || "")) || SHORT_INV.test(String(t || ""));
function applySetup(o) {
  if (!o || typeof o !== "object") return false;
  const allowed = new Set(SETUP_KEYS());
  for (const [k, v] of Object.entries(o)) if (allowed.has(k) && typeof v === "string") LS.set(k, v);
  return true;
}
function importSetup(text) {
  const m = /#(?:setup|invite)\.([A-Za-z0-9_-]+)/.exec(String(text || ""));
  if (!m) return false;
  let o;
  try { o = JSON.parse(new TextDecoder().decode(b64u.dec(m[1]))); } catch { return false; }
  return applySetup(o);
}
/** Long or short invite. A short one is fetched from the relay and decrypted here. */
async function importAny(text) {
  const m = SHORT_INV.exec(String(text || ""));
  if (!m) return importSetup(text);
  try {
    const r = await fetch(INVITE_RELAY + "?id=" + encodeURIComponent(m[1]), { cache: "no-store" });
    if (!r.ok) return false;
    const j = await r.json();
    return applySetup(await decrypt(j.v, await importKey(m[2])));
  } catch { return false; }
}
/** Stores [o] encrypted on the relay and returns the short link, or "" when the relay can't be reached. */
async function shortInvite(o) {
  try {
    const kb = crypto.getRandomValues(new Uint8Array(32)), k64 = b64u.enc(kb);
    const id = b64u.enc(crypto.getRandomValues(new Uint8Array(16)));
    const v = await encrypt(o, await importKey(k64));
    const r = await fetch(INVITE_RELAY, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: JSON.stringify({ id, v }) });
    if (!r.ok) return "";
    return location.origin + location.pathname + "#j." + id + "." + k64;
  } catch { return ""; }
}
async function doPaste() {
  const inp = $("#pasteLink");
  if (inp && isInvite(inp.value)) {
    if (await importAny(inp.value)) { LS.set(WELCOME_KEY, "1"); toast("Setup copied to this app", "ok"); setTimeout(() => { location.hash = "#/welcome"; location.reload(); }, 600); }
    else toast("That setup link is damaged. Copy it again.", "warn");
    return;
  }
  const l = parseLink(inp && inp.value);
  if (!l) { toast("That doesn't look like a Jarvis link.", "warn"); return; }
  await pair(l); toast("Linked to your TV", "ok"); location.hash = "#/";
  route();
}

      const on = !inWL(type, id);
      const pid = S.profile || "p1";
      const L = S.plists[pid] || (S.plists[pid] = { watchlist: [], favorites: [], continue: [], ts: 0 });
      const wl = (L.watchlist || []).filter((r) => !(r.type === type && +r.id === id));
      if (on) wl.unshift({ type, id });
      L.watchlist = wl; savePlists(); syncWL(); // optimistic
      const cmd = { cmd: "watchlist", type, id, on, name: d.name || "", poster: d.poster || "", backdrop: d.backdrop || "", year: d.year || "" };
      if (S.profile) cmd.profile = S.profile; // this profile's watchlist on the TV
      WLQ.send(cmd, pid);
      break;
    }
    case "trailer": playTrailer(); break;
    case "clearerrs": LS.del(ERR_KEY); drawErrs(); toast("Cleared"); break;
    case "applyupdate": applyUpdate(true); break;
    case "retry": askInit(); toast("Asking your TV…"); setStatus(S.link ? "connecting" : "none"); setTimeout(() => { if (!keys().tmdb) route(); }, 8500); break;
    case "reload": route(); break;
    case "paste": doPaste(); break;
    case "unpair": if (confirm("Unlink this browser from your TV?")) { unpair(); toast("Unlinked"); location.hash = "#/pair"; } break;
    case "copym3u": {
      const m3u = String((S.init && S.init.m3u_url) || "").trim();
      if (!m3u) break;
      try { await navigator.clipboard.writeText(m3u); toast("Playlist link copied", "ok"); } catch { prompt("Copy your playlist link:", m3u); }
      break;
    }
    case "findtvs": {
      const btn = $("#findTvBtn"), ul = $("#tvFound");
      if (btn) btn.disabled = true;
      if (ul) ul.innerHTML = `<li><span class="pill">…</span><span>Asking your TVs. This takes about 10 seconds.</span></li>`;
      const r = await findTvs();
      const ul2 = $("#tvFound"), btn2 = $("#findTvBtn");
      if (ul2) { ul2.innerHTML = tvFoundHTML(r); statusAt = 0; nowFetchAll(); }
      if (btn2) btn2.disabled = false;
      const p = $("#tvpick"); if (p && !p.classList.contains("hidden")) openTvPicker();
      if (!r.error && !r.tvs.length) toast(NO_TV, "warn");
      break;
    }
    case "usetv": {
      const t = tvsRead().find((x) => x.id === d.id) || (tvFindLast && tvFindLast.tvs.find((x) => x.id === d.id));
      if (!t) break;
      await useTv(t); toast("Play on TV now goes to " + tvListName(t), "ok");
      closeTvPicker();
      const ul = $("#tvFound"); if (ul) ul.innerHTML = tvFoundHTML(tvFindLast);
      break;
    }
    case "closepick": closeTvPicker(); break;
    case "paircode": {
      const inp = $("#pairCode");
      const code = String((inp && inp.value) || "").replace(/\D/g, "");
      if (code.length !== 8) { toast("Type the 8 digits shown on the TV.", "warn"); break; }
      try {
        if (await connectWithCode(code)) { if (inp) inp.value = ""; toast("Connected to your house", "ok"); route(); }
        else toast("That code didn't work. Codes work once, for 15 minutes. Get a new one on the TV.", "warn");
      } catch { toast("Couldn't reach the Jarvis relay. Check your internet and try again.", "warn"); }
      break;
    }
    case "addtv": {
      const inp = $("#addTvCode");
      const code = String((inp && inp.value) || "").replace(/\D/g, "");
      if (code.length !== 8) { toast("Type the 8 digits shown on the TV.", "warn"); break; }
      const house = S.init && S.init.house;
      if (!house) { toast("Open Jarvis once while one of your TVs is on (it sends its house link), then try again.", "warn"); break; }
      try {
        // Same as the TV (app/.../data/HouseJoin.kt): topic and key come from the code.
        const topic = "mcdtv-join-" + [...await sha("jarvis-join|" + code)].map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 24);
        const key = await crypto.subtle.importKey("raw", await sha("jarvis-join-key|" + code), "AES-GCM", false, ["encrypt", "decrypt"]);
        const r = await fetch(RELAY + topic, { method: "POST", body: await encrypt({ type: "house_invite", house, ts: Date.now() }, key) });
        if (!r.ok) throw new Error(String(r.status));
        if (inp) inp.value = "";
        toast("Sent. The TV joins in a few seconds.", "ok");
      } catch { toast("Couldn't reach the relay. Check your internet and try again.", "warn"); }
      break;
    }
    case "invite": {
      const tk = $("#invTok");
      const url = await inviteLink(d.pid, !!(tk && tk.checked));
      try {
        // The link goes in the text itself: Messages keeps it there (a separate "url" was sometimes dropped).
        if (navigator.share) await navigator.share({ text: "Tap to set up Jarvis on your phone: " + url });
        else { await navigator.clipboard.writeText(url); toast("Invite copied. Send it by text or email.", "ok"); }
      } catch (err) {
        if (err && err.name === "AbortError") break; // closed the share sheet
        try { await navigator.clipboard.writeText(url); toast("Invite copied. Send it by text or email.", "ok"); } catch { prompt("Copy this invite:", url); }
      }
      break;
    }
    case "copyinvite": {
      const url = LS.get(INVITE_KEY) || setupLink();
      try { await navigator.clipboard.writeText(url); toast("Invite copied. Now add Jarvis to your Home Screen.", "ok"); } catch { prompt("Copy this invite:", url); }
      break;
    }
    case "pasteinvite": {
      let t = "";
      try { t = await navigator.clipboard.readText(); } catch {}
      if (!isInvite(t)) t = prompt("Paste your Jarvis invite here:") || "";
      if (isInvite(t) && await importAny(t)) { LS.set(WELCOME_KEY, "1"); toast("Jarvis is set up", "ok"); setTimeout(() => { location.hash = "#/welcome"; location.reload(); }, 500); }
      else if (t) toast("That isn't a Jarvis invite. Open the invite in Safari and tap Copy invite.", "warn");
      break;
    }
    case "welcomedone": LS.del(WELCOME_KEY); location.hash = "#/"; break;
    case "copysetup": {
      const url = setupLink();
      try { await navigator.clipboard.writeText(url); toast("Setup copied. Open the Jarvis app, Settings > Your TVs, paste it and tap Link.", "ok"); }
      catch { prompt("Copy this setup link:", url); }
      break;
    }
    case "copylink": {
      const url = location.origin + location.pathname + "#" + S.link.id + "." + S.link.key;
      try { await navigator.clipboard.writeText(url); toast("Link copied. Open it on your other device.", "ok"); } catch { prompt("Copy this link:", url); }
      break;
    }
    case "savetmdb": {
      const val = $("#tmdbIn").value.trim(); if (!val) return;
      S.manualTmdb = val; LS.set("mcdtv_web_tmdb", val); tcache.clear(); toast("TMDB key saved", "ok"); renderSettings($("#view")); break;
    }
    case "setprofile": setProfile(d.pid); toast("Watching as " + profileName(d.pid), "ok"); renderSettings($("#view")); break;
    case "photopick": { const inp = $("#photoIn"); if (!inp || !PIDS.includes(d.pid)) break; inp.dataset.pid = d.pid; inp.value = ""; inp.click(); break; }
    case "photodel":
      if (PIDS.includes(d.pid) && confirm("Remove " + profileName(d.pid) + "'s photo here and on your TVs?")) {
        await PH.remove(d.pid); toast("Photo removed for " + profileName(d.pid), "ok"); renderSettings($("#view"));
      }
      break;
    case "pickprofile": {
      setProfile(d.pid);
      const next = d.next && d.next.startsWith("#/") && !d.next.startsWith("#/profiles") ? d.next : "#/";
      if (location.hash === next) route(); else location.hash = next;
      break;
    }
    case "addonadd": {
      let u = (($("#addonIn") || {}).value || "").trim().replace(/^stremio:\/\//i, "https://");
      if (!okUrl(u)) { toast("Paste the addon's https link", "warn"); break; }
      const list = myAddons(); if (!list.includes(u)) list.push(u);
      LS.set(ADDON_MINE, JSON.stringify(list)); S.streamCache.clear(); toast("Addon added on this device", "ok"); renderSettings($("#view"));
      break;
    }
    case "addondel": {
      const list = myAddons(); list.splice(+d.i, 1);
      LS.set(ADDON_MINE, JSON.stringify(list)); S.streamCache.clear(); toast("Addon removed from this device", "ok"); renderSettings($("#view"));
      break;
    }
    case "rdtsave": {
      const val = ($("#rdtIn") || {}).value || "";
      const t = val.trim();
      if (!/^[A-Za-z0-9]{20,80}$/.test(t)) { toast("That doesn't look like a Real-Debrid API token", "warn"); break; }
      const r = await rdFetch("GET", "rest/1.0/user", null, t).catch(() => null);
      if (!r || !r.ok) { toast("Real-Debrid didn't accept that token", "warn"); break; }
      LS.set(RDT_KEY, t); stampOk("rdt"); rdLoginUi(); toast("API token saved on this device", "ok");
      break;
    }
    case "netcheck": netCheck(); break;
    case "rdtclear": if (confirm("Remove the Real-Debrid API token from this device? You would need to paste it again to play inside Jarvis.")) { LS.del(RDT_KEY); rdLoginUi(); toast("API token removed from this device", "ok"); } break;
    case "rdverify": {
      const b = $("#rdVerify"); if (b) b.disabled = true;
      try { const u = await rdCall("GET", "/user"); toast("Real-Debrid works" + (u && u.username ? ": " + u.username : ""), "ok"); }
      catch (err) { toast(err.message || "Real-Debrid didn't answer", "warn"); }
      rdLoginUi(); break;
    }
    case "rdlogin": rdLoginStart().catch((err) => toast(err.message || "Real-Debrid didn't answer", "warn")); break;
    case "rdcancel": RDL.code = null; clearTimeout(RDL.timer); rdLoginUi(); break;
    case "rdout": if (confirm("Disconnect Real-Debrid on this device?")) { saveRdc(null); rdLoginUi(); toast("Real-Debrid disconnected on this device", "ok"); } break;
    case "rmjarvis": if (confirm("Remove the Jarvis key from this device? Ask Jarvis then goes through your TV.")) { LS.set(JLOCAL, "0"); LS.del(JKEY); toast("Jarvis key removed from this device", "ok"); renderSettings($("#view")); } break;
    case "live": LV.playIn(+d.idx, d.g || ""); break;
    case "lvtile": LV.tile(d.row, +d.n); break;
    case "lvfeeds": LV.feeds(d.g); break;
    case "lvkind": LV.kind(d.kind); break;
    case "lvazmore": LV.azMore(); break;
    case "livesec": LV.section(d.sec); break;
    case "livesport": LV.sport(d.sub || ""); break;
    case "livefav": LV.fav(+d.idx); break;
    case "livegame": LV.game(d.id); break;
    case "livemore": LV.more(); break;
    case "liveretry": LV.reset(); route(); break;
    case "dismisshint": { const h = $("#iosHint"); if (h) h.remove(); break; }
    case "cleartmdb": if (confirm("Remove your TMDB key from this device? Your TV's key still works when the TV answers.")) { S.manualTmdb = ""; LS.del("mcdtv_web_tmdb"); tcache.clear(); renderSettings($("#view")); } break;
    case "savemdb": {
      const val = $("#mdbIn").value.trim(); if (!val) return;
      S.manualMdb = val; LS.set("mcdtv_web_mdb", val); toast("MDBList key saved", "ok"); renderSettings($("#view")); break;
    }
  }
});
// ---------- updates ----------
// iPhone keeps a Home Screen app frozen in memory, so it can run an old version for days. When the app comes back
// to the screen, compare BUILD with the published page. A new version reloads at once only when nothing is going
// on. During playback, a source lookup, Real-Debrid sign-in or the hand-off question it waits: a small "Update
// ready" button shows instead, and the update applies on the next quiet moment (a page change or a return to the app).
const BUILD = "2026-10-29.1";
let lastUpdateCheck = 0, updateReady = "";
function updateBusy() {
  const h = location.hash;
  if (/^#\/(play|sources)\//.test(h)) return "player"; // the in-app player, or a source lookup on the Sources page
  if ($("#lvPlayer")) return "live"; // Live TV playing in the app
  if ($("#hoAsk")) return "handoff"; // "Where did you stop?" is open
  if (RDL.code && Date.now() < RDL.until) return "rdlogin"; // waiting for Real-Debrid sign-in
  if ($$("video").some((x) => !x.paused && !x.ended)) return "video"; // a trailer or any other video
  return "";
}
function applyUpdate(force) {
  if (!updateReady) return false;
  if (!force && updateBusy()) { showUpdateChip(); return false; }
  if (S.bgSave) { try { S.bgSave(); } catch {} } // keep the play position
  location.reload();
  return true;
}
function showUpdateChip() {
  if ($("#updChip")) return;
  const b = document.createElement("button");
  b.type = "button"; b.id = "updChip"; b.className = "upd-chip"; b.dataset.act = "applyupdate";
  b.textContent = "Update ready. Tap to update.";
  document.body.appendChild(b);
}
async function checkForUpdate() {
  if (updateReady) { applyUpdate(false); return; }
  if (Date.now() - lastUpdateCheck < 60000) return;
  lastUpdateCheck = Date.now();
  try {
    const t = await (await fetch("./index.html?u=" + Date.now(), { cache: "no-store" })).text();
    const m = /const BUILD = "([^"]+)"/.exec(t);
    if (m && m[1] !== BUILD) { updateReady = m[1]; applyUpdate(false); }
  } catch {}
}
setTimeout(checkForUpdate, 3000);
window.addEventListener("hashchange", () => { document.title = "Jarvis"; route(); if (updateReady) setTimeout(() => applyUpdate(false), 300); });

// ---------- install (PWA) ----------
const isStandalone = () => { try { return navigator.standalone === true || matchMedia("(display-mode: standalone)").matches; } catch { return false; } };
function iosInstallHint() {
  const ua = navigator.userAgent;
  const ios = /iP(hone|od|ad)/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua);
  if (!ios || !safari || isStandalone() || LS.get("mcdtv_web_ios_hint")) return;
  LS.set("mcdtv_web_ios_hint", "1"); // shown once
  const d = document.createElement("div");
  d.className = "ioshint"; d.id = "iosHint"; d.setAttribute("role", "note");
  d.innerHTML = `<p>Tap Share, then Add to Home Screen to install Jarvis.</p><button type="button" data-act="dismisshint" aria-label="Dismiss">&#215;</button>`;
  document.body.appendChild(d);
  setTimeout(() => { if (d.isConnected) d.remove(); }, 20000);
}
if ("serviceWorker" in navigator && window.isSecureContext) {
  // The version in the worker's address: a new BUILD installs a new worker with its own shell cache, and the old
  // cache is deleted when it takes over. updateViaCache "none": the browser never uses a stale copy of sw.js.
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js?v=" + encodeURIComponent(BUILD), { updateViaCache: "none" }).catch((e) => logErr("Service worker: " + ((e && e.message) || e), "sw.js")); });
}

// ---------- start ----------
(async function start() {
  if (isInvite(location.hash)) {
    // Opened from an invite: set this browser up, keep the invite for the Home Screen app, show the next steps.
    const h = location.hash;
    if (await importAny(h)) { LS.set(INVITE_KEY, location.origin + location.pathname + h); LS.set(WELCOME_KEY, "1"); S.profile = LS.get(PROFILE_KEY) || S.profile; S.init = readJSON(INIT_KEY); S.plists = readJSON(PLISTS_KEY) || {}; }
    history.replaceState(null, "", location.pathname + location.search + "#/welcome");
  }
  updateProfileUI();
  const fromHash = parseLink(location.hash);
  const stored = parseLink(LS.get(LINK_KEY));
  if (fromHash) { history.replaceState(null, "", location.pathname + location.search + "#/"); await pair(fromHash); }
  else if (stored) await pair(stored);
  else setStatus("none");
  adoptHouse(); // the Control page may know the house when no TV sent it here
  if (!S.link) autoFindTvs();
  route();
  // The house's copy: settings and lists even when no TV answers.
  syncHouse();
  setTimeout(iosInstallHint, 2500);
})();
</script>
